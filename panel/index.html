<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Habit</title>
    <style>
      html, body { margin: 0; height: 100%; }
      #root {
        height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px; line-height: 1.45;
        background: var(--oc-bg, #0d1420); color: var(--oc-fg, #e6ebf2);
      }
      .habit-main { padding: 12px; display: grid; gap: 12px; max-width: 100%; box-sizing: border-box; }
      .habit-counts { margin: 0; font-size: 12.5px; color: var(--oc-muted, #8b98ab); }
      .habit-section-title { font-size: 13px; font-weight: 650; margin: 0 0 8px; }
      .card {
        border: 1px solid var(--oc-border, #2a3345); border-radius: var(--oc-radius, 8px);
        background: var(--oc-elevated, #131b29); padding: 10px 12px;
      }
      .capture-grid { display: grid; gap: 8px; }
      .capture-row { display: flex; gap: 8px; align-items: center; }
      .capture-row select { flex: 0 1 auto; min-width: 0; }
      .capture-row button { flex: 0 0 auto; }
      .field-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      button {
        font: inherit; font-size: 12.5px; font-weight: 550; padding: 6px 12px; cursor: pointer;
        border-radius: var(--oc-radius, 8px);
        border: 1px solid var(--oc-border, #2a3345);
        background: var(--oc-elevated, #1a2230);
        color: var(--oc-fg, #e6ebf2);
        white-space: nowrap;
      }
      button:hover { background: var(--oc-hover, #232c3e); border-color: var(--oc-focus, #6ea8fe); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--oc-focus, #6ea8fe); outline-offset: 1px; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary {
        background: var(--oc-primary, #3b82f6); border-color: transparent;
        color: var(--oc-primary-fg, #fff); font-weight: 650;
      }
      button.primary:hover { filter: brightness(1.12); background: var(--oc-primary, #3b82f6); border-color: transparent; }
      button.ghost { background: transparent; }
      button.ghost:hover { background: var(--oc-hover, #232c3e); }
      button.sm { padding: 4px 10px; font-size: 12px; }
      button.danger-ghost {
        background: transparent;
        border-color: color-mix(in srgb, var(--oc-error, #b44747) 55%, transparent);
        color: var(--oc-error-text, #ff8a8a);
      }
      button.danger-ghost:hover { background: var(--oc-error, #b44747); color: #fff; border-color: transparent; }
      input, textarea, select {
        font: inherit; font-size: 12.5px; padding: 7px 9px;
        border-radius: var(--oc-radius, 8px);
        border: 1px solid var(--oc-border, #2a3345);
        background: var(--oc-bg, #0d1420);
        color: var(--oc-fg, #e6ebf2);
      }
      input::placeholder, textarea::placeholder { color: var(--oc-muted, #8b98ab); opacity: 0.8; }
      input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 1px solid var(--oc-focus, #6ea8fe); outline-offset: 0; border-color: var(--oc-focus, #6ea8fe);
      }
      .habit-list { display: grid; gap: 8px; }
      .habit-title { font-size: 13px; font-weight: 650; margin: 0; overflow-wrap: anywhere; }
      .habit-detail { margin: 2px 0 0; color: var(--oc-fg, #e6ebf2); overflow-wrap: anywhere; }
      .habit-meta { font-size: 12px; color: var(--oc-muted, #8b98ab); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .badge {
        font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
        border: 1px solid var(--oc-border, #2a3345); color: var(--oc-muted, #8b98ab);
      }
      .badge.project { color: var(--oc-primary-text, #9cc2ff); border-color: color-mix(in srgb, var(--oc-primary, #3b82f6) 50%, transparent); }
      .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
      .actions.subtle { margin-top: 6px; }
      .notice { margin: 0; min-height: 1.2em; font-size: 12.5px; color: var(--oc-muted, #8b98ab); }
      .empty { margin: 0; color: var(--oc-muted, #8b98ab); }
      pre.diff {
        margin: 8px 0 0; padding: 8px 10px; max-height: 260px; overflow: auto;
        font-family: var(--oc-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 12px; line-height: 1.5; background: var(--oc-bg, #0d1420);
        border: 1px solid var(--oc-border, #2a3345); border-radius: var(--oc-radius, 8px);
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .diff-line.add { color: var(--oc-success-text, #7ee2a8); }
      .diff-line.remove { color: var(--oc-error-text, #ff8a8a); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
